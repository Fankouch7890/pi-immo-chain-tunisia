<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4B1B7F" />
      <stop offset="50%" stop-color="#6B21A8" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>
  </defs>

  <!-- Background Circle/Card -->
  <rect width="512" height="512" rx="100" fill="url(#bg)" />

  <!-- Outer Ring (Blockchain Node) -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#gold)" stroke-width="6" stroke-dasharray="16 10" opacity="0.6" />

  <!-- Building / Real Estate Icon -->
  <g transform="translate(0, -10)">
    <!-- Main Tower -->
    <path d="M180 370 V 210 L 256 150 L 332 210 V 370 Z" fill="#FFFFFF" opacity="0.95" />
    <!-- Roof highlight -->
    <path d="M256 140 L 342 208 L 332 220 L 256 160 L 180 220 L 170 208 Z" fill="url(#gold)" />

    <!-- Windows -->
    <rect x="210" y="230" width="30" height="35" rx="4" fill="#6B21A8" />
    <rect x="272" y="230" width="30" height="35" rx="4" fill="#6B21A8" />
    <rect x="210" y="285" width="30" height="35" rx="4" fill="#6B21A8" />
    <rect x="272" y="285" width="30" height="35" rx="4" fill="#6B21A8" />

    <!-- Door -->
    <path d="M240 370 V 330 A 16 16 0 0 1 272 330 V 370 Z" fill="url(#gold)" />
  </g>

  <!-- Pi Symbol (π) Badge -->
  <g transform="translate(256, 105)">
    <circle cx="0" cy="0" r="45" fill="url(#gold)" />
    <!-- Pi Letter -->
    <text x="0" y="16" font-family="sans-serif" font-weight="bold" font-size="52" fill="#4B1B7F" text-anchor="middle">π</text>
  </g>

  <!-- Tunisia Flag Colors Ribbon -->
  <path d="M130 420 Q 256 450 382 420" fill="none" stroke="url(#accent)" stroke-width="12" stroke-linecap="round" />
  <circle cx="256" cy="434" r="10" fill="#FFFFFF" />
  <path d="M 254 430 A 4 4 0 1 0 254 438 A 3 3 0 1 1 254 430" fill="#E11D48" />

  <!-- Text Header -->
  <text x="256" y="475" font-family="'Cairo', sans-serif" font-weight="800" font-size="26" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">PI IMMO TUNISIA</text>
</svg>